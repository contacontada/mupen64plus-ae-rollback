name: Mupen64Plus-AE

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386

    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'adopt'

    - name: Set up environment variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

    - name: Checkout mupen64plus-ae repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Decode debug keystore
      env:
        DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
      run: |
        if [ -z "$DEBUG_KEYSTORE" ]
        then
           echo "No debug keystore value"
        else
           echo $DEBUG_KEYSTORE > debug.keystore.base64
           base64 --decode debug.keystore.base64 > debug.keystore
           sudo cp -f debug.keystore $HOME/.android/.
        fi

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends file gawk

    - name: Build artifact
      run: ./gradlew assemble

    - name: Declare branch name
      id: branch-name
      uses: tj-actions/branch-names@v8

    - name: Get branch name
      id: var
      run: |
        echo "branch=${{ steps.branch-name.outputs.current_branch }}" >> $GITHUB_OUTPUT

    - name: Declare sha name
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
      with:
        length: 7

    - name: Get sha name
      run: |
        echo $SHA
      env:
        SHA: ${{ steps.short-sha.outputs.sha }}

    - name: Prepare APK and source archive for release
      run: |
        mkdir -p release-assets
        cp app/build/outputs/apk/release/Mupen64PlusAE-release.apk "release-assets/M64PLUS R.apk"
        tar --exclude=.git --exclude=release-assets --exclude=.gradle --exclude='*/.gradle' --exclude=build --exclude='*/build' --exclude='*/externalNativeBuild' --exclude='*/.cxx' -czf release-assets/mupen64plus-ae-rollback-patch52.tar.gz .

    - name: Upload APK and source archive
      uses: actions/upload-artifact@v4
      with:
        name: mupen64plus-ae-rollback-patch52-${{ env.SHA }}
        path: release-assets/*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout mupen64plus-ae repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Declare branch name
      id: branch-name
      uses: tj-actions/branch-names@v8

    - name: Get branch name
      id: var
      run: |
        echo "branch=${{ steps.branch-name.outputs.current_branch }}" >> $GITHUB_OUTPUT

    - name: Declare sha name
      uses: benjlevesque/short-sha@v3.0
      id: short-sha
      with:
        length: 7

    - name: Get sha name
      run: |
        echo $SHA
      env:
        SHA: ${{ steps.short-sha.outputs.sha }}

    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        tag: Pre-release
        body: "Patch 52 build of M64PLUS R Rollback."
        artifacts: "dist/**/*"
        token: ${{ secrets.GITHUB_TOKEN }}
